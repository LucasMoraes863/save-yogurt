<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: rgb(212, 212, 212)">
    <h1>Calculadora financeira</h1>
    <h4>Quanto voce transporta de produtos por mês em toneladas: <input style="background-color: rgb(145, 215, 228);" type="number" id="id_transporte"></h4>
    <h4>Quanto voce perde de mercadoria por falta de controle térmico por mês em toneladas: <input style="background-color: rgb(145, 215, 228);" type="number" id="id_perda"></h4>
    <h4>Qual é o valor da mercadoria por mês em toneladas: <input style="background-color: rgb(145, 215, 228);" type="number" id="id_valor"></h4>

    <button style= "background-color: rgb(145, 215, 228);"onclick="calculo_perda_atual()">Calcular perda atualmente</button>
    <button style= "background-color: rgb(145, 215, 228);" onclick="calculo_depois_iot()">Calcular resultados depois do IOT</button>

    <h3 style="color: red;" id="id_mensagem"></h3><br>
    <h3 style="color: blue" id="id_mensagem_iot"></h3><br>
    <h3 style="color: blue" id="id_mensagem_extra"></h3><br>
</body>
<script>
    function calculo_perda_atual() {
        let perda_total_financeiro = Number(id_perda.value * id_valor.value)
        let porcentagem_perdida = Number((id_perda.value * 100) / id_transporte.value)
        // console.log(perda_total_financeiro)
        // console.log(porcentagem_perdida)
        id_mensagem.innerHTML = `A sua porcentagem de perda por mês é de ${porcentagem_perdida.toFixed(2)}%, e sua perda financeira é de R$${perda_total_financeiro.toFixed(2)} (${perda_total_financeiro / 1000000} Milhões de reais)!`
    }
    function calculo_depois_iot() {
        let perda_total_financeiro = Number(id_perda.value * id_valor.value)
        let porcentagem_perdida = Number((id_perda.value * 100) / id_transporte.value)
        let economia_após_iot = Number(perda_total_financeiro - (perda_total_financeiro / 3))
        let porcentagem_recuperada = Number(porcentagem_perdida - (porcentagem_perdida / 3))
        id_mensagem_iot.innerHTML = `Com IOT, sua perda poderá ser reduzida em até no mínimo R$${economia_após_iot.toFixed(2)} (${(economia_após_iot / 1000000).toFixed(2)} Milhões de reais), tendo assim ${porcentagem_recuperada.toFixed(2)}% recuperados após a utilização do produto!`
        id_mensagem_extra.innerHTML = `Lembrando que o MÍNIMO que você poderá lucrar é este valor, o valor do prejuízo pode ser TOTALMENTE recuperado!`
    }
</script>
</html>
