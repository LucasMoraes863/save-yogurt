<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <style>
        body {
            background-color: #a2e9ff;
            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            animation: flutuar 3s ease-in-out infinite;
            transition: transform 0.3s;
        }

        @keyframes flutuar {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0px);
            }

        }

        .btn:hover {
            cursor: pointer;
        }
    </style>
    <div animation-name><img class="logo" src="Save_Yogurt_Logo_Vetorizada_Ofc.png" style="width: 75px;
            height: 75px;"></div><br>
    <h1>Calculadora financeira</h1>

    <br><br>


    <label>Quantos paletes são transportadas por ano?</label><br>
    <input type="number" id="ipt_quantidade_cargas" placeholder="Ex. 100"><br><br>

    <label>Quantas perdas por falha na cadeia fria? (Sem "%")</label><br>
    <input type="number" id="ipt_taxa_perda" placeholder="Ex. 15"><br><br>

    <label>Qual o valor médio do palete de iogurte (R$)?</label><br>
    <input type="number" id="ipt_valor_medio" placeholder="Ex. 1000"><br><br>

    <button class="btn" onclick="calcular()">Calcular Retorno</button>

    <br><br>


    <br><br>

    <div id="output"></div>

    <br><br>

    <div id="output2">
        <button class="btn" onclick="explicar()" style="display:none;" id="btn_ROI">
            O que é ROI?
        </button>
    </div>
    </div>


    <script>
        let contador = 0
        function calcular() {

            let volume = Number(ipt_quantidade_cargas.value);
            let taxaPerda = Number(ipt_taxa_perda.value) / 100;
            let valorCarga = Number(ipt_valor_medio.value);

            let cargasPerdidas = volume * taxaPerda;

            let reducaoSensor = 0.8;

            let cargasPerdidasComSensor = cargasPerdidas * (1 - reducaoSensor);

            let cargasEvitadas = cargasPerdidas - cargasPerdidasComSensor;

            let valorSemSensor = volume * valorCarga * taxaPerda;
            let valorComSensor = valorSemSensor * (1 - reducaoSensor);
            let economia = valorSemSensor - valorComSensor;

            output.innerHTML = `
<h3>Resultado da Simulação</h3>

Paletes estimadas perdidas após o sensor: ${cargasPerdidasComSensor.toFixed(0)} <br>
Paletes estimadas preservadas após o sensor: ${cargasEvitadas.toFixed(0)} <br>
Prejuízo estimado sem sensor: <span style="color:#ab0c0c;font-weight:bold;">R$ ${valorSemSensor.toFixed(2)} (R$ ${valorSemSensor.toFixed(2) / 1000000.} Milhões)</span> <br>
Prejuízo máximo estimado com o sensor: R$ ${valorComSensor.toFixed(2)} (R$ ${valorComSensor.toFixed(0) / 1000000} Milhões) <br>
Economia mínima estimada com o sensor: R$ ${economia.toFixed(2)} (R$ ${economia / 1000000} Milhões) <br>
`;

            btn_ROI.style.display = "inline";

        }

        function explicar() {
            if (contador == 0) {
                contador++
                output2.innerHTML = `
    <br><br>
    <b>ROI (Return on Investment)</b> significa retorno sobre investimento.
    Ele mostra quanto dinheiro a empresa economiza ou ganha após investir
    em uma solução, como sensores de monitoramento de temperatura.

    `;

            }
        }

    </script>

</body>

</html>
