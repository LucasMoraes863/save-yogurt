<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="id_tema"></div>
    <h1 style="background-color: blue; color: white; text-align:center;" id="id_titulo" text>Calculadora Financeira -
        SaveYogurt</h1>

    <!--Botão de alterar Tema (CSS)-->
    <div style="text-align: right;">
        <button onclick="TemaWhite()" style="display:none;" id="button_black">Mudar Tema</button>
        <button onclick="TemaBlack()" style="display:inline;" id="button_white">Mudar Tema</button>
    </div>

    <!--Título da Calculadora Financeira-->
    <h3>Para saber o impacto do nosso produto em sua empresa, informe cada uma das orientações abaixo:</h3>

    <!--Resultados em Média-->
    <div id="id_resultado_mediano" style="display: inline;">
        <label for="id_lote_litro">Informe quantos litros tem em cada caixa de iogurte por dia</label><br>
        <input type="number" id="id_lote_litro" placeholder="Litros por Lote"> <br><br>
        <label for="id_lote_perdido">Informe quantos lotes se perdem por mês por conta de gestão de temperatura (em
            unidades):</label><br>
        <input type="number" id="id_lote_perdido" placeholder="Lotes Perdidos Por mês"><br>
        <button onclick="Calcular1()">Verificar Informações</button><br>
        <button onclick="Adicionar()">Adicionar Mais informações</button>
    </div>

    <!--Resultados com informações adicionais-->
    <div id="resultado_mais_info" style="display:none">
        <label for="id_preco_por_litro">Informe o preço por litro de seu produto </label><br>
        <input type="number" id="id_preco_por_litro" placeholder="Preço Por Litro"><br><br>
        <label for="id_lote_litro_adicionais">Informe quantos litros tem em cada caixa de iogurte por dia</label><br>
        <input type="number" id="id_lote_litro_adicionais" placeholder="Litros por Lote"> <br><br>
        <label for="id_tempo">Informe o período de tempo que quer que seja calculado o valor de seus ganhos (em
            meses):</label><br>
        <input type="number" id="id_tempo" placeholder="Tempo a ser calculado"> <br><br>
        <label for="id_lote_perdido_adicionais">Informe quantos lotes se perdem no período de tempo indicado
            anteriormente por
            conta de gestão de temperatura (em unidades):</label><br>
        <input type="number" id="id_lote_perdido_adicionais" placeholder="Lotes Perdidos"><br><br>
        <div style="display: inline-block;width: 300px;">
            <label for="id_temperatura_min">Informe a temperatura mínima que o produto suporta (em ºC):</label><br>
            <input type="number" id="id_temperatura_min" placeholder="Temperatura Min">
        </div>
        <div style="display: inline-block;width: 300px;">
            <label for="id_temperatura_max">Informe a temperatura máxima que o produto suporta (em ºC):</label><br>
            <input type="number" id="id_temperatura_max" placeholder="Temperatura Máx">
        </div><br>
        <button onclick="Calcular2()">Verificar Informações</button><br>
        <button onclick="Retornar()">Retornar as informações anteriores</button>
    </div>
    <p id="id_resultados"></p>
</body>



<script>
    let BotaoBlack = document.getElementById("button_black");
    let BotaoWhite = document.getElementById("button_white");
    let Adicionais = document.getElementById("resultado_mais_info");
    let Inicial = document.getElementById("id_resultado_mediano");
    function TemaBlack() {
        BotaoBlack.style.display = "inline";
        BotaoWhite.style.display = "none";
        id_tema.innerHTML = "<style>body{background-color:black;color: white};</style>"
    }
    function TemaWhite() {
        BotaoWhite.style.display = "inline";
        BotaoBlack.style.display = "none";
        id_tema.innerHTML = "<style>body{background-color:white;color: black};</style>"
    }
    function Calcular1() {
        let Litros = Number(id_lote_litro.value)
        let Perdido = Number(id_lote_perdido.value)
        let Qtd_Recuperado = 0
        if (Litros <= 0) {
            id_resultados.innerHTML = "Informe um número maior que zero no campo (Litros por lote)"
            if (Perdido <= 0) {
                id_resultados.innerHTML += "<br>Informe um número maior que zero no campo (Lotes Perdidos)"
            }
        }
        else {
            if (Perdido <= 0) {
                id_resultados.innerHTML = "Informe um número maior que zero no campo (Lotes Perdidos)"
            }
            else {
                Qtd_Recuperado = (Litros * 2.02 * Perdido)
                id_resultados.innerHTML = `<h2>O nosso produto ajudará você a não perder, pelo menos R$${Qtd_Recuperado.toFixed(2)} por mês</h2><br><br>
                    <b style=color:red;>O que pode fazer com que esse valor se altere?</b><br>
                    - <b>Caso não haja o cumprimento do serviço de manutenção dos refrigeradores a tempo:</b> O tempo máximo que um iogurte pode ficar fora da temperatura ideal é de aproximadamente 2:00h. Ao passar disso, o produto pode ser considerado estragado!...<br><br>
                    - <b>Problemas de instalação do produto:</b> Caso o nosso produto não seja instalado da maneira devida, isso pode impactar no seu desempenho e função. Certifique-se que o produto foi intalado da maneira correta e segundo as intruções. Nesse caso, entre em contato!<br><br>
                    - <b>Problemas não relacionados à temperatura:</b> O nosso produto certifica que apenas a temperatura esteja dentro do ideal, problemas com agentes transmissores de doenças ou problemas técnicos na fabricação do Iogurte estão fora de nosso alcance para solução<br><br>
                    <b style="color:blue">Caso não seja nenhum dos problemas citados acima, entre em contato! </b>`
            }
        }
    }
    function Adicionar() {
        Adicionais.style.display = "inline";
        Inicial.style.display = "none"
    }
    function Retornar() {
        Adicionais.style.display = "none";
        Inicial.style.display = "inline"
    }
    let PrecoLitro = Number(id_preco_por_litro.value)
    let LoteAdicionais = Number(id_lote_litro_adicionais.value)
    let PerdaAdicionais = Number(id_lote_perdido_adicionais.value)
    let Tempo = Number(id_tempo.value)
    let TemperaturaMin = (id_temperatura_min.value)
    let TemperaturaMax = (id_temperatura_max.value)

    function Calcular2() {
        PrecoLitro = Number(id_preco_por_litro.value)
        LoteAdicionais = Number(id_lote_litro_adicionais.value)
        Tempo = Number(id_tempo.value)
        PerdaAdicionais = Number(id_lote_perdido_adicionais.value)
        TemperaturaMin = (id_temperatura_min.value)
        TemperaturaMax = (id_temperatura_max.value)
        id_resultados.innerHTML = " "
        let Qtd_Recuperado_adicionais = 0
        var Condicionais = 1
        if (Condicionais >= 1) {
            var Condicionais = 0
            if (PrecoLitro <= 0) {
                id_resultados.innerHTML += "Informe um número maior que zero no campo (Preço por Litro)<br>"
                Condicionais ++
            }
            if (LoteAdicionais <= 0) {
                id_resultados.innerHTML += "Informe um número maior que zero no campo (Litros por Lote)<br>"
                Condicionais ++
            }
            if (Tempo <= 0) {
                id_resultados.innerHTML += "Informe um número maior que zero no campo (Tempo a ser Calculado)<br>"
                Condicionais ++
            }
            if (PerdaAdicionais <= 0) {
                id_resultados.innerHTML += "Informe um número maior que zero no campo (Lotes Perdidos)<br>"
                Condicionais ++
            }
            if (TemperaturaMin == ""){
                id_resultados.innerHTML += "Informe um valor válido no campo (Temperatura Min)<br>"
                Condicionais ++
            }
            if (TemperaturaMax == ""){
                id_resultados.innerHTML += "Informe um valor válido no campo (Temperatura Máx)<br>"
                Condicionais ++
            }
            if (TemperaturaMax < TemperaturaMin){
                id_resultados.innerHTML += "Informe um valor válido no campo (Temperatura Máx) que seja maior que a Temperatura Mínima<br>"
                Condicionais ++
            }
        }
        if (Condicionais<=0){
            Qtd_Recuperado_adicionais = PrecoLitro * LoteAdicionais * Tempo * PerdaAdicionais
            id_resultados.innerHTML += `<h2>O nosso produto ajudará você a não perder, no máximo R$${Qtd_Recuperado_adicionais.toFixed(2)} pelo tempo de ${Tempo} mês(s)</h2><br><br>
                    <b style=color:red;>O que pode fazer com que esse valor se altere?</b><br>
                    - <b>Caso não haja o cumprimento do serviço de manutenção dos refrigeradores a tempo:</b> O tempo máximo que um iogurte pode ficar fora da temperatura ideal <span style="color:blue">(De ${TemperaturaMin}°C a ${TemperaturaMax}°C) </span> é de aproximadamente 2:00h. Ao passar disso, o produto pode ser considerado estragado!...<br><br>
                    - <b>Problemas de instalação do produto:</b> Caso o nosso produto não seja instalado da maneira devida, isso pode impactar no seu desempenho e função. Certifique-se que o produto foi intalado da maneira correta e segundo as intruções. Nesse caso, entre em contato!<br><br>
                    - <b>Problemas não relacionados à temperatura:</b> O nosso produto certifica que apenas a temperatura esteja dentro do ideal, problemas com agentes transmissores de doenças ou problemas técnicos na fabricação do Iogurte estão fora de nosso alcance para solução<br><br><br>
                    <b style="color:blue">Caso não seja nenhum dos problemas citados acima, entre em contato! </b>`
        }

    }
</script>

</html>
