<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-color: #F2FFFE;
            text-align: center;
        }
    </style>
    <img src="https://cdn.discordapp.com/attachments/1471596501397405721/1479617838288474213/Save_Yogurt_Logo_Vetorizada_Ofc.png?ex=69acb0fe&is=69ab5f7e&hm=334c30b49bf6470599257bba7b4e1095003639fb85db159ff8f87cae847c6c3a&" style="width: 75px;
            height: 75px;"><br>
  <h1>Calculadora financeira</h1>

<br><br>

<label>Quantos caminhões transportam iogurte atualmente?</label><br>
<input type="number" id="ipt_qtd_caminhoes" placeholder="Ex. 100"><br><br>

<label>Qual o volume de cargas transportadas por ano (toneladas)?</label><br>
<input type="number" id="ipt_volume_cargas" placeholder="Ex. 100"><br><br>

<label>Qual a porcentagem média de perdas por falha na cadeia fria? (Sem %)</label><br>
<input type="number" id="ipt_taxa_perda" placeholder="Ex. 15"><br><br>

<label>Qual o valor médio de uma carga de iogurte (R$)?</label><br>
<input type="number" id="ipt_valor_medio" placeholder="Opcional"><br><br>

<button onclick="calcular()">Calcular Retorno</button>

<br><br>

<button onclick="explicar()" style="display:none;" id="btn_ROI">
*O que é ROI?
</button>

<br><br>

<div id="output"></div>

<script>

function calcular(){

let volume = Number(ipt_volume_cargas.value);
let taxaPerda = Number(ipt_taxa_perda.value) / 100;
let valorCarga = Number(ipt_valor_medio.value);


let perdaToneladas = volume * taxaPerda;


let reducaoSensor = 0.8;

let perdaComSensor = perdaToneladas * (1 - reducaoSensor);


let economiaToneladas = perdaToneladas - perdaComSensor;

output.innerHTML = `
<h3>Resultado da Simulação</h3>

Perda anual estimada: ${perdaToneladas.toFixed(2)} toneladas <br>
Perda com sensor: ${perdaComSensor.toFixed(2)} toneladas <br>
Economia estimada com os sensores: ${economiaToneladas.toFixed(2)} toneladas <br>
`;


btn_ROI.style.display = "inline";

}

function explicar(){

output.innerHTML += `
<br><br>
<b>ROI (Return on Investment)</b> significa retorno sobre investimento.
Ele mostra quanto dinheiro a empresa economiza ou ganha após investir
em uma solução, como sensores de monitoramento de temperatura.
`;

}

</script>

</body>
</html>
