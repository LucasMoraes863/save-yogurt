<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Financeira</title>
</head>
<style>
    body{
        text-align: center; 
        background-color: lightblue;
    }
    button{
        border-radius: 8px;

    }
</style>
<body>
    <h1>Calculadora financeira</h1>
    <h3>VALORES INCONCUSIVOS(MUDAR PARA VERSAO FINAL)</h3>
    
    <br><br>

    <label for="ipt_volume_cargas">Qual o volume de cargas transportadas por ano. Em toneladas</label> <!--Quantidade total de viagens-->
    <input type="number" id="ipt_volume_cargas" placeholder="Ex. 100"><br>

    <label for="ipt_taxa_perda">Taxa média de perda de cargas por quebra da cadeia fria no transporte(Sem o sinal de %)</label>
    <input type="number" id="ipt_taxa_perda" placeholder="Ex. 15"><br>

    <label for="ipt_valor_medio">(Opcional) Valor médio da carga</label>
    <input type="number" id="ipt_valor_medio" placeholder="Opcional"><br><br>

    <button onclick="calcular()">Calcular Retorno</button><br><br>

    <div id="div_resultado" style="color: blue;"></div><br><br>

    <button onclick="explicar()" style="display: none;" id="btn_ROI">*O que é ROI?</button><br><br>

    <div id="div_roi" style="color: rgb(57, 57, 57);"></div>
</body>
</html>
<script>
    function calcular(){
        let volume_cargas = Number(ipt_volume_cargas.value) / 2
        let taxa_perda = Number(ipt_taxa_perda.value)
        let valor_medio = Number(ipt_valor_medio.value)
        let valor_instalacao = 20000
        let prejuizo
        let economia_gerada
        let retorno

        if(valor_medio != 0 && valor_medio > 0){
            prejuizo = valor_medio * (volume_cargas * (taxa_perda / 100))
        }else if(valor_medio == 0){
            prejuizo = 110000 * (volume_cargas * (taxa_perda / 100))
        }
        
        economia_gerada = prejuizo * 0.8

        retorno = ((economia_gerada - valor_instalacao)/ valor_instalacao) * 100

        div_resultado.innerHTML = `Investindo R$ 20.000,00 no sistema SAVE-YOGURT, você economiza R$${economia_gerada.toFixed(2)} por ano, um ROI* de ${retorno}%!`
        div_resultado.innerHTML += `<br>Sem o investimento você continuara perdendo R$${prejuizo.toFixed(2)}`

        btn_ROI.style = "display: content"
    }
    function explicar(){
        div_roi.innerHTML = `ROI significa Return on Investment (em português, Retorno sobre o Investimento). <br>Em termos simples, o ROI responde à principal dúvida do seu cliente: "Para cada 1 real que eu gastar com o sistema SAVE-YOGURT, quantos reais vão voltar para o meu bolso?".`
    }
</script>
